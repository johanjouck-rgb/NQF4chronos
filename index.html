<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Entraînement Vocabulaire Pelckmans</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --bg: #121212; --card: #1e1e1e; --accent: #f1c40f; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        #container { width: 95%; max-width: 1100px; margin: 40px auto; text-align: center; }
        
        .selector-container { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #333; }
        select { padding: 12px; background: #333; color: white; border-radius: 6px; border: 1px solid var(--primary); font-size: 16px; width: 250px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .set-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; transition: 0.3s; }
        .set-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 15px; width: 100%; margin-top: 10px; transition: 0.3s; font-weight: bold; }
        .btn-secondary { background: #555; }
        .btn:hover { filter: brightness(1.2); }

        .screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        
        #word-display { font-size: 60px; font-weight: bold; margin: 40px 0; color: var(--accent); text-shadow: 2px 2px 10px rgba(0,0,0,0.5); padding: 0 20px; text-align: center; }
        #timer-container { width: 70%; height: 12px; background: #333; border-radius: 6px; margin: 20px auto; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 1s linear; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #444; text-align: left; }
        th { background: #333; color: var(--primary); }
        .scroll-area { width: 90%; max-height: 70vh; overflow-y: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        
        input[type="text"] { background: #333; color: white; border: 1px solid #555; padding: 8px; width: 90%; border-radius: 4px; }
    </style>
</head>
<body>

<div id="container">
    <h1>Entraînement Vocabulaire Pelckmans</h1>
    <p style="color: #888;">Sélectionnez un Trajet pour générer les 10 séries d'exercices.</p>
    
    <div class="selector-container">
        <label style="margin-right: 15px;">Choisir le Trajet :</label>
        <select id="trajet-select" onchange="generateSets(this.value)">
            <option value="">-- Faites un choix --</option>
            <option value="1">Trajet 1</option>
            <option value="2">Trajet 2</option>
            <option value="3">Trajet 3</option>
            <option value="4">Trajet 4</option>
            <option value="5">Trajet 5</option>
            <option value="6">Trajet 6</option>
            <option value="7">Trajet 7</option>
        </select>
    </div>

    <div class="grid" id="set-grid"></div>
</div>

<div id="edit-screen" class="screen">
    <h2 id="edit-title">Modifier la Série</h2>
    <div class="scroll-area">
        <table id="edit-table">
            <thead>
                <tr><th>Néerlandais</th><th>Français</th><th>Action</th></tr>
            </thead>
            <tbody id="edit-body"></tbody>
        </table>
        <button class="btn btn-secondary" onclick="addRow()" style="margin-top:10px;">+ Ajouter un mot</button>
    </div>
    <div style="display:flex; gap:15px; width: 90%; max-width: 500px;">
        <button class="btn" onclick="saveAndStart()">🚀 Enregistrer et Commencer</button>
        <button class="btn btn-secondary" onclick="closeEdit()">Annuler</button>
    </div>
</div>

<div id="exercise" class="screen">
    <div id="info-header" style="font-size: 1.2rem; color: #aaa;"></div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    <div id="word-display">Chargement...</div>
    <div style="display:flex; gap:15px;" id="exercise-ctrls">
        <button class="btn" style="width:140px; background:#555;" id="pause-btn" onclick="togglePause()">Pause</button>
        <button class="btn" style="width:140px; background:var(--danger);" onclick="location.reload()">Arrêter</button>
    </div>
</div>

<div id="result" class="screen">
    <h2 style="color: var(--success);">Série terminée !</h2>
    <div class="scroll-area">
        <table>
            <thead><tr><th>Néerlandais</th><th>Français</th></tr></thead>
            <tbody id="res-body"></tbody>
        </table>
    </div>
    <button class="btn" style="margin-top: 20px; width:250px;" onclick="location.reload()">Retour au menu</button>
</div>

let allSets = [];
let currentSetIdx = 0, wordIdx = 0, timeLeft = 8, isPaused = false, interval;

// --- VASTE SHUFFLE FUNCTIE ---
function seededShuffle(array, seed) {
    let m = array.length, t, i;
    const random = () => {
        var x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    };
    while (m) {
        i = Math.floor(random() * m--);
        t = array[m];
        array[m] = array[i];
        array[i] = t;
    }
    return array;
}

function generateSets(trajetNum) {
    const grid = document.getElementById('set-grid');
    grid.innerHTML = '';
    if (!trajetNum) return;

    let gefilterd = woordenLijst.filter(w => w.t == trajetNum);
    let gemixt = seededShuffle([...gefilterd], 12345);
    allSets = [];

    for (let i = 0; i < 10; i++) {
        let start = i * 14; 
        let set = gemixt.slice(start, start + 14);
        if (set.length < 14 && gemixt.length > 0) {
             set = [...set, ...gemixt.slice(0, 14 - set.length)];
        }
        if (set.length > 0) allSets.push(set);
    }

    allSets.forEach((set, i) => {
        const card = document.createElement('div');
        card.className = 'set-card';
        card.innerHTML = `
            <h3>Série ${i+1}</h3>
            <p style="color:#888; font-size:14px;">Trajet ${trajetNum} - ${set.length} mots</p>
            <button class="btn" onclick="startSet(${i})">🚀 Commencer</button>
            <button class="btn btn-secondary" onclick="openEdit(${i})">👀 Voir la liste</button>
        `;
        grid.appendChild(card);
    });
}

// --- TIMER FUNCTIES ---
function updateTimerBar() {
    const bar = document.getElementById('timer-bar');
    const percentage = (timeLeft / 8) * 100;
    bar.style.width = percentage + "%";
    
    // Kleur veranderen als tijd bijna op is
    if (timeLeft <= 2) bar.style.background = "var(--danger)";
    else bar.style.background = "var(--success)";
}

// --- EXERCISE LOGIC ---
function startSet(idx) {
    currentSetIdx = idx; wordIdx = 0; isPaused = false;
    document.getElementById('container').style.display = 'none';
    document.getElementById('exercise').style.display = 'flex';
    document.getElementById('timer-container').style.display = 'block';
    nextWord();
}

function nextWord() {
    const set = allSets[currentSetIdx];
    if (wordIdx >= set.length) { 
        wachtenOpDocent(); 
        return; 
    }
    
    timeLeft = 8;
    isPaused = false;
    document.getElementById('pause-btn').innerText = "Pause";
    document.getElementById('word-display').innerText = set[wordIdx].nl;
    document.getElementById('word-display').style.fontSize = "60px";
    document.getElementById('info-header').innerText = `Série ${currentSetIdx+1} — Mot ${wordIdx+1}/${set.length}`;
    updateTimerBar();

    if (interval) clearInterval(interval);
    interval = setInterval(() => {
        if (!isPaused) {
            timeLeft--; 
            updateTimerBar();
            if (timeLeft <= 0) { 
                wordIdx++; 
                nextWord(); 
            }
        }
    }, 1000);
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pause-btn').innerText = isPaused ? "Reprendre" : "Pause";
}

function wachtenOpDocent() {
    clearInterval(interval);
    document.getElementById('timer-container').style.display = 'none'; 
    document.getElementById('word-display').innerText = "Série terminée !";
    document.getElementById('word-display').style.fontSize = "40px";
    
    const ctrlContainer = document.getElementById('exercise-ctrls');
    ctrlContainer.innerHTML = `
        <button class="btn" style="width: auto; padding: 15px 40px; font-size: 20px; background: var(--success);" onclick="showResults()">
            👀 Afficher les Solutions
        </button>
        <button class="btn" style="width:auto; padding: 15px 30px; background:var(--danger);" onclick="location.reload()">Arrêter</button>
    `;
}

function showResults() {
    document.getElementById('exercise').style.display = 'none';
    document.getElementById('result').style.display = 'flex';
    
    const resBody = document.getElementById('res-body');
    resBody.innerHTML = allSets[currentSetIdx].map(w => `
        <tr>
            <td style="padding: 12px;">${w.nl}</td>
            <td style="color:var(--primary); font-weight:bold; padding: 12px;">${w.fr}</td>
        </tr>
    `).join('');
}

// --- EDIT / LIST LOGIC ---
function openEdit(idx) {
    currentSetIdx = idx;
    document.getElementById('edit-title').innerText = `Liste Série ${idx+1}`;
    const body = document.getElementById('edit-body');
    body.innerHTML = '';
    
    allSets[idx].forEach((word, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" value="${word.nl}" onchange="updateWord(${i}, 'nl', this.value)"></td>
            <td><input type="text" value="${word.fr}" onchange="updateWord(${i}, 'fr', this.value)"></td>
            <td><button class="btn btn-danger" onclick="deleteRow(${i})" style="width:auto; padding:5px 10px; margin:0;">X</button></td>
        `;
        body.appendChild(row);
    });
    document.getElementById('edit-screen').style.display = 'flex';
}

function updateWord(i, lang, val) {
    allSets[currentSetIdx][i][lang] = val;
}

function addRow() {
    allSets[currentSetIdx].push({nl: "", fr: ""});
    openEdit(currentSetIdx);
}

function deleteRow(i) {
    allSets[currentSetIdx].splice(i, 1);
    openEdit(currentSetIdx);
}

function saveAndStart() {
    document.getElementById('edit-screen').style.display = 'none';
    startSet(currentSetIdx);
}

function closeEdit() {
    document.getElementById('edit-screen').style.display = 'none';
}
